; AURA - AI Robot Pet for M5Stack Core2
; Build: pio run -e m5stack-core2
; Upload: pio run -e m5stack-core2 -t upload

[platformio]
default_envs = m5stack-core2
src_dir = src
include_dir = include

[env:m5stack-core2]
platform = espressif32@6.13.0
board = m5stack-core2
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
board_build.partitions = huge_app.csv
board_build.embed_files =

build_flags =
    -D CORE2=1
    -D M5UNIFIED_PC_BUILD=0
    -std=gnu++17
    -Wall
build_unflags =
    -std=gnu++11
build_src_filter = +<*>

lib_deps =
    m5stack/M5GFX@0.2.33
    m5stack/M5Unified@0.2.26

monitor_filters = esp32_exception_decoder, time
